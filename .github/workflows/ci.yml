name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15 比 macos-latest(26) 的 runner 资源充裕，免费账号调度成功率更高；
    # Xcode 16 SDK 足够编译（部署目标 macOS 14）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -project Qianshou.xcodeproj -scheme Qianshou -configuration Debug -destination 'platform=macOS' build

      - name: Test
        # 单元测试 22 项必过；UI 测试的结构项必过，
        # 交互项在 CI 无头环境自动 skip（macOS XCUITest 点击在 CI 不可靠），本地人工验证
        run: xcodebuild -project Qianshou.xcodeproj -scheme Qianshou -destination 'platform=macOS' test
