name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15 比 macos-latest(26) 的 runner 资源充裕，免费账号调度成功率更高；
    # Xcode 16 SDK 足够编译（部署目标 macOS 14）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -project Qianshou.xcodeproj -scheme Qianshou -configuration Debug -destination 'platform=macOS' build

      - name: Test
        # CI 只跑单元测试（22 项，稳定全绿）。
        # UI 测试（XCUITest）在 macOS 无头 CI 环境不可靠（App 窗口/AX 树
        # 不完整，点击合成事件不生效），保留为本地人工验证流程：
        #   xcodebuild -project Qianshou.xcodeproj -scheme Qianshou \
        #     -destination 'platform=macOS' test -only-testing:QianshouUITests
        run: xcodebuild -project Qianshou.xcodeproj -scheme Qianshou -destination 'platform=macOS' test -only-testing:QianshouTests
